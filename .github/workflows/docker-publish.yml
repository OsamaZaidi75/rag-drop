name: docker-publish

# Build the image on GitHub Actions and push it to GHCR, so the Oracle VM
# (2 CPUs, slow builds) just pulls instead of building. The VM is ARM64,
# so the image MUST be linux/arm64 — built here with QEMU + buildx.
#
#   ghcr.io/<owner>/rag-drop:latest
#   ghcr.io/<owner>/rag-drop:<git sha>
#
# No user secrets: authentication uses the built-in GITHUB_TOKEN with
# packages:write. The image name uses github.repository so it survives a
# repo rename. The visibility step is best-effort (continue-on-error):
# a first push may create a private package, and making it public needs
# an extra permission the token may not have — if it fails, flip it to
# public in the package settings on GitHub.

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public (best effort)
        continue-on-error: true
        run: |
          PACKAGE="${{ github.repository }}"
          REPO_NAME="${PACKAGE#*/}"
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/${{ github.repository_owner }}/packages/container/${REPO_NAME}" \
            -d '{"visibility":"public"}' || true
